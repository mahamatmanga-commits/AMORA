<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La pyramide de Ponzi — animation 9:16</title>
<style>
  @font-face { font-family: 'PZDisplay'; src: url('fonts/InterDisplay-Black.woff2') format('woff2'); font-weight: 900; }
  @font-face { font-family: 'PZDisplay'; src: url('fonts/InterDisplay-ExtraBold.woff2') format('woff2'); font-weight: 800; }
  @font-face { font-family: 'PZDisplay'; src: url('fonts/InterDisplay-Bold.woff2') format('woff2'); font-weight: 700; }
  @font-face { font-family: 'PZText'; src: url('fonts/Inter-SemiBold.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: 'PZText'; src: url('fonts/Inter-Bold.woff2') format('woff2'); font-weight: 700; }

  :root { --bg: #05060f; --panel: #11142e; --ink: #f5f7ff; --mute: #a3aad6; --accent: #ffd23f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'PZText', system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  #stage { height: min(calc(100vh - 150px), 1920px); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); background: #070918; display: block; }
  .bar { width: min(560px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  button { font: inherit; font-weight: 700; color: var(--ink); background: var(--panel); border: 1px solid #2a2f5e; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #play { min-width: 92px; background: var(--accent); color: #0b0e22; border-color: var(--accent); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; color: var(--mute); min-width: 92px; text-align: right; font-size: 14px; }
  .chapters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chapters button { font-size: 12px; padding: 5px 10px; font-weight: 600; color: var(--mute); }
  .hint { font-size: 12px; color: var(--mute); text-align: center; }
  body.render { padding: 0; display: block; background: #000; }
  body.render #stage { height: 1920px; width: 1080px; border-radius: 0; box-shadow: none; }
  body.render .bar, body.render .hint { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920" aria-label="Animation : la pyramide de Ponzi expliquée simplement"></canvas>
<div class="bar">
  <div class="row">
    <button id="play" type="button">▶ Lecture</button>
    <input id="seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="Position">
    <span id="time">0,00 / 60 s</span>
  </div>
  <div class="row chapters" id="chapters"></div>
</div>
<p class="hint">Espace : lecture/pause · ← → : ±1 s · , . : image par image · M : son</p>
<audio id="audio" preload="auto" src="output/ponzi-soundtrack.m4a"></audio>

<script src="src/animation.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const renderMode = params.has('render');
  if (renderMode) document.body.classList.add('render');

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  await Promise.all(Ponzi.FONTS.map((f) => document.fonts.load(f)));
  await document.fonts.ready;

  // Mode rendu (utilisé par scripts/render.cjs)
  window.__frame = (t) => { Ponzi.render(ctx, t); };
  window.__png = (t) => { Ponzi.render(ctx, t); return canvas.toDataURL('image/png'); };
  window.__ready = true;
  if (renderMode) { Ponzi.render(ctx, +(params.get('t') || 0)); return; }

  // ── Lecteur interactif ──
  const D = Ponzi.DURATION;
  const play = document.getElementById('play');
  const seek = document.getElementById('seek');
  const time = document.getElementById('time');
  const audio = document.getElementById('audio');
  let audioOk = false;
  audio.addEventListener('canplaythrough', () => { audioOk = true; }, { once: true });
  audio.addEventListener('error', () => { audioOk = false; });

  let t = +(params.get('t') || 0), playing = false, last = 0, muted = false;
  const fmtT = (x) => x.toFixed(2).replace('.', ',');
  function draw() {
    Ponzi.render(ctx, t);
    seek.value = t;
    time.textContent = `${fmtT(t)} / ${D} s`;
  }
  function setPlaying(p) {
    playing = p;
    play.textContent = p ? '❚❚ Pause' : '▶ Lecture';
    if (audioOk && !muted) {
      if (p) { audio.currentTime = t; audio.play().catch(() => {}); } else audio.pause();
    }
    last = performance.now();
    if (p) requestAnimationFrame(loop);
  }
  function loop(now) {
    if (!playing) return;
    if (audioOk && !muted && !audio.paused) t = audio.currentTime;
    else t += (now - last) / 1000;
    last = now;
    if (t >= D) { t = 0; if (audioOk && !muted) audio.currentTime = 0; }
    draw();
    requestAnimationFrame(loop);
  }
  function jump(x) {
    t = Math.min(D - 0.001, Math.max(0, x));
    if (audioOk) audio.currentTime = t;
    draw();
  }
  play.addEventListener('click', () => setPlaying(!playing));
  seek.addEventListener('input', () => jump(+seek.value));
  const chapters = document.getElementById('chapters');
  [{ a: 0, n: '00', label: 'ACCROCHE' }, ...Ponzi.CHAPTERS, { a: Ponzi.T.outro, n: '08', label: 'CONCLUSION' }].forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = `${c.n} · ${c.label.charAt(0)}${c.label.slice(1).toLowerCase()}`;
    b.addEventListener('click', () => jump(Math.max(0, c.a - 0.3)));
    chapters.appendChild(b);
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'ArrowRight') jump(t + 1);
    else if (e.key === 'ArrowLeft') jump(t - 1);
    else if (e.key === '.') jump(t + 1 / Ponzi.FPS);
    else if (e.key === ',') jump(t - 1 / Ponzi.FPS);
    else if (e.key === 'm' || e.key === 'M') { muted = !muted; if (muted) audio.pause(); else if (playing && audioOk) { audio.currentTime = t; audio.play().catch(() => {}); } }
  });
  draw();
})();
</script>
</body>
</html>
